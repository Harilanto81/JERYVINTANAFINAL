name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential
        pip3 install --upgrade pip setuptools wheel
        pip3 install buildozer==1.5.0 cython==0.29.36

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Check java version (optional)
      run: java -version

    - name: Prepare stable python-for-android and use NDK r25b
      run: |
        set -e
        P4A_DIR=.buildozer/android/platform/python-for-android
        mkdir -p "$P4A_DIR"
        pip3 install python-for-android==2024.1.21 --target "$P4A_DIR" --no-deps

        NDK_VERSION=25b
        BASE_DIR="$HOME/.buildozer/android/platform"
        NDK_DIR="$BASE_DIR/android-ndk-r${NDK_VERSION}"
        mkdir -p "$BASE_DIR"

        if [ ! -d "$NDK_DIR" ]; then
          echo "Downloading Android NDK r${NDK_VERSION}..."
          wget -q -O /tmp/android-ndk.zip "https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip"
          unzip -q /tmp/android-ndk.zip -d "$BASE_DIR"
          rm /tmp/android-ndk.zip || true
        else
          echo "NDK r${NDK_VERSION} already present at $NDK_DIR"
        fi

        echo "ANDROIDNDK=$NDK_DIR" >> $GITHUB_ENV
        echo "Set ANDROIDNDK=$NDK_DIR"

        if grep -q "^android.ndk" buildozer.spec 2>/dev/null; then
          sed -i "s/^android.ndk.*/android.ndk = ${NDK_VERSION}/" buildozer.spec || true
        else
          echo "android.ndk = ${NDK_VERSION}" >> buildozer.spec
        fi

    - name: Ensure icon.png exists
      run: |
        if [ ! -f icon.png ]; then
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=' | base64 --decode > icon.png
          echo "Created placeholder icon.png"
        else
          echo "icon.png exists"
        fi

    - name: Ensure buildozer targets 64-bit ABIs
      run: |](#)
