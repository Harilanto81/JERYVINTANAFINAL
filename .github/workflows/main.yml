name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Nettoyage de l'espace disque
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"

    # 2. Java 17 avec le bon nom 'temurin'
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Dépendances système d'Ubuntu 24.04 sans libffi7
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache

    # 4. Installation des outils de build (Cython < 3.0 est crucial)
    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    # 5. Build de l'APK avec options mémoire & logs détaillés
    - name: Build APK
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m"
        buildozer -v android debug

    # 6. Récupération de l'APK (Artifact v4)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JeryVintana-APK
        path: bin/*.apk
