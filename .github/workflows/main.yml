name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev build-essential

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Clean pip cache
      run: |
        pip cache purge
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36 buildozer==1.4.6

    - name: Set up Android NDK
      run: |
        NDK_VERSION=25b
        BASE_DIR="$HOME/.buildozer/android/platform"
        NDK_DIR="$BASE_DIR/android-ndk-r${NDK_VERSION}"
        mkdir -p "$BASE_DIR"

        if [ ! -d "$NDK_DIR" ]; then
          wget -q -O /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d "$BASE_DIR"
          rm /tmp/ndk.zip
        fi

        echo "ANDROIDNDK=$NDK_DIR" >> $GITHUB_ENV

    - name: Create icon if missing
      run: |
        [ ! -f icon.png ] && echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=' | base64 --decode > icon.png

    - name: Clean previous builds
      run: rm -rf .buildozer/ build/ dist/ bin/

    - name: Build APK
      env:
        BUILDOZER_SKIP_PIP_UPGRADE: 1
      run: buildozer android debug 2>&1 | tee build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: JeryVintana-APK
        path: bin/*.apk
