name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip3 install --upgrade pip
        pip3 install buildozer==1.5.0 cython==0.29.36

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Check java version (optional)
      run: java -version

    - name: Prepare stable python-for-android and fix NDK
      run: |
        # 1. Télécharger la version stable de p4a (2024.1.21) et l'extraire 
        # dans le dossier exact où Buildozer s'attend à la trouver.
        # Cela empêche Buildozer d'utiliser la branche master (qui a le bug Python 3.14).
        P4A_DIR=.buildozer/android/platform/python-for-android
        mkdir -p $P4A_DIR
        pip3 install python-for-android==2024.1.21 --target $P4A_DIR --no-deps
        
        # 2. Forcer une version de NDK valide (27c) car p4a recommande à tort la version 28c
        grep -q "^android.ndk" buildozer.spec && sed -i 's/^android.ndk.*/android.ndk = 27c/' buildozer.spec || echo "android.ndk = 27c" >> buildozer.spec

    - name: Ensure icon.png exists
      run: |
        if [ ! -f icon.png ]; then
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=' | base64 --decode > icon.png
          echo "Created placeholder icon.png"
        else
          echo "icon.png exists"
        fi

    - name: Ensure buildozer targets 64-bit ABIs
      run: |
        # Ensure android.ndk exists (kept from earlier step if present)
        grep -q "^android.ndk" buildozer.spec || echo "android.ndk = 27c" >> buildozer.spec

        # Prefer android.archs (modern Buildozer); replace or append the desired list
        if grep -q "^android.archs" buildozer.spec; then
          sed -i "s/^android.archs.*/android.archs = arm64-v8a, armeabi-v7a/" buildozer.spec
        else
          echo "android.archs = arm64-v8a, armeabi-v7a" >> buildozer.spec
        fi

        # Fallback for android.arch (older naming)
        if grep -q "^android.arch" buildozer.spec; then
          sed -i "s/^android.arch.*/android.arch = arm64-v8a, armeabi-v7a/" buildozer.spec || true
        fi

        echo "::group::buildozer.spec (tail)"
        tail -n 20 buildozer.spec || true
        echo "::endgroup::"

    - name: Build with Buildozer
      run: buildozer android debug

    - name: Verify APK contains arm64 libs
      run: |
        apk=$(ls -1 bin/*.apk 2>/dev/null | head -n1 || true)
        if [ -z "$apk" ]; then
          echo "No APK found in bin/ — listing bin/:"
          ls -la bin || true
          exit 1
        fi
        echo "Built APK: $apk"
        echo "Checking for lib/arm64-v8a inside the APK..."
        if unzip -l "$apk" | grep -q "lib/arm64-v8a/"; then
          echo "OK: arm64 libs found in APK."
        else
          echo "ERROR: arm64 libs NOT found in APK. Listing APK lib/ entries:"
          unzip -l "$apk" | grep "lib/" || true
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JeryVintana-APK
        path: bin/*.apk
