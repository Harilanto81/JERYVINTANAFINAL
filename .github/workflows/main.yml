name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache libjpeg-dev libpng-dev

    - name: Install Buildozer & P4A Stable
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "cython<3.0.0" "buildozer==1.5.0" "python-for-android==2024.1.21"

    - name: Build APK
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m"
        export ACCEPT_SDK_LICENSES="1"
        
        # Nettoyage préventif des builds échoués
        rm -rf .buildozer
        
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JeryVintana-APK
        path: bin/*.apk
