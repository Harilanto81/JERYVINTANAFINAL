                          back_callback=lambda: setattr(MDApp.get_running_app().sm, 'current', 'ecran_accueil'))
        self.layout.add_widget(toolbar)

        box = MDBoxLayout(orientation='vertical', padding=25, spacing=20)
        box_pct = FlatCard(orientation='vertical', size_hint_y=0.3, padding=20, corner_radius=dp(20))
        self.lbl_pourcentage = MDLabel(text="0.00 %", font_style='H2', halign='center', valign='middle', bold=True, theme_text_color="Custom")
        box_pct.add_widget(self.lbl_pourcentage)

        box_comment = FlatCard(orientation='vertical', size_hint_y=0.4, padding=20, corner_radius=dp(20))
        self.lbl_comment = DynamicLabel(text="", font_size='16sp', halign='center')
        box_comment.add_widget(self.lbl_comment)

        btn_refaire = FlatButton(label_text="Hanao Fifamabinana hafa", size_hint_y=0.1, bg_color=(0.6, 0.2, 0.7, 1))
        btn_refaire.bind(on_release=lambda *x: setattr(MDApp.get_running_app().sm, 'current', 'ecran_fifamabinana'))

        box.add_widget(box_pct)
        box.add_widget(box_comment)
        box.add_widget(btn_refaire)
        self.layout.add_widget(box)
        self.add_widget(self.layout)

    def afficher_resultat(self, pourcentage, is_opp):
        pct_str = f"{pourcentage:.2f} %"
        if pourcentage >= 70:
            self.lbl_pourcentage.text_color = (0, 1, 0, 1)
            comment = "Mirary hafaliana sy fitahiana ianareo roa ! Mifanambina tsara na vola na zanaka na fahasalamana."
        elif pourcentage >= 50:
            self.lbl_pourcentage.text_color = (1, 0.84, 0, 1)
            comment = "Mifanambina ihany ianareo. Mety hiroso ho fianakaviana nefa mila fifehezana."
        else:
            self.lbl_pourcentage.text_color = (1, 0.3, 0.2, 1)
            if is_opp:
                comment = "Voarara ny fiarahana noho ny fifanotoana sady tsy mahay miaraka koa ny singa."
            else:
                comment = "Latsaka kely ny antonony ny fifanambinana noho ny toetra tsy mahay miaraka."
        self.lbl_pourcentage.text = pct_str
        self.lbl_comment.text = comment


