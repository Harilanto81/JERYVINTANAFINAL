# APPLICATION PRINCIPALE AVEC PICKERS
# ==========================================
class JeryVintanaApp(MDApp):
    def build(self):
        self.theme_cls.primary_palette = "DeepPurple"
        self.theme_cls.accent_palette = "Amber"
        self.theme_cls.theme_style = "Dark"

        Builder.load_string(KV_PRINCIPAL)

        self.sm = MDScreenManager(transition=SlideTransition(direction='left'))
        self.sm.add_widget(EcranAccueil(name='ecran_accueil'))
        self.sm.add_widget(EcranPrincipal(name='ecran_principal'))
        self.sm.add_widget(EcranVintanao(name='ecran_vintanao'))
        self.sm.add_widget(EcranFifamabinana(name='ecran_fifamabinana'))
        self.sm.add_widget(EcranFinalFifam(name='ecran_final_fifam'))
        self.sm.current = 'ecran_accueil'
        return self.sm

    def go_back(self):
        self.sm.current = 'ecran_accueil'

    def show_date_picker(self):
        date_dialog = MDDatePicker()
        date_dialog.bind(on_save=self.on_date_save)
        date_dialog.open()

    def on_date_save(self, instance, value, date_range):
        screen = self.sm.get_screen('ecran_principal')
        screen.selected_date = value
        screen.ids.date_input.text = value.strftime("%d/%m/%Y")
        screen.ids.date_input.line_color_normal = (0, 1, 0, 1)  # Vert si valide

    def show_time_picker(self):
        time_dialog = MDTimePicker()
        time_dialog.bind(on_time=self.on_time_save)
        time_dialog.open()

    def on_time_save(self, instance, time):
        screen = self.sm.get_screen('ecran_principal')
        screen.selected_time = time
        screen.ids.time_input.text = time.strftime("%H:%M")
        screen.ids.time_input.line_color_normal = (0, 1, 0, 1)  # Vert si valide

    def set_timezone(self, tz, active_btn, inactive_btn):
        screen = self.sm.get_screen('ecran_principal')
        screen.selected_tz = tz
        active_btn.bg_color = self.theme_cls.primary_color
        inactive_btn.bg_color = self.theme_cls.bg_dark

if __name__ == '__main__':
    JeryVintanaApp().run()
