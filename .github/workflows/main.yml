name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Nettoyage des caches
    - name: Clean Cache & Free Disk Space
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"

    # 2. Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. Dépendances système Ubuntu 22.04
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache libjpeg-dev libpng-dev

    # 5. Outils de build avec Cython < 3.0
    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    # 6. Exécution du Build avec NDK r25b explicite
    - name: Build APK
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m"
        export ACCEPT_SDK_LICENSES="1"
        buildozer -v android debug

    # 7. Sauvegarde Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JeryVintana-APK
        path: bin/*.apk
