name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip3 install --upgrade pip
        pip3 install sh==1.14.3
        pip3 install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.1.21

    - name: Fix p4a and NDK versions
      run: |
        # 1. Pré-cloner python-for-android avec le tag stable (2024.1.21) pour éviter le bug de la branche master (conflit sh>=2.0)
        mkdir -p .buildozer/android/platform
        git clone -b 2024.1.21 --single-branch https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android
        
        # 2. Forcer une version de NDK valide (27c) car p4a recommande à tort la version 28c qui n'existe pas
        grep -q "^android.ndk" buildozer.spec && sed -i 's/^android.ndk.*/android.ndk = 27c/' buildozer.spec || echo "android.ndk = 27c" >> buildozer.spec

    - name: Build with Buildozer
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JeryVintana-APK
        path: bin/*.apk
