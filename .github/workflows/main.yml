name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 1. Libérer de l'espace disque et de la RAM sur le runner GitHub
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"

    # 2. Configurer Java 17 (Requis pour les builds Android récents)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'termurin'
        java-version: '17'

    # 3. Installer les dépendances système requises par Kivy / Buildozer
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache libffi7

    # 4. Installer Buildozer et Cython
    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    # 5. Compiler l'APK avec gestion mémoire
    - name: Build APK
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m"
        buildozer -v android debug

    # 6. Sauvegarder l'APK généré
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: bin/*.apk
