name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Nettoyage espace disque
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"

    # 2. Configurer Python 3.11 (Crucial pour la stabilité de p4a/Cython)
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Configurer Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. Dépendances système d'Ubuntu 24.04
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache

    # 5. Installer les bons outils Python
    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    # 6. Exécuter la compilation avec acceptation des licences Android SDK
    - name: Build APK
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m"
        export ACCEPT_SDK_LICENSES="1"
        yes | buildozer -v android debug

    # 7. Sauvegarde de l'APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JeryVintana-APK
        path: bin/*.apk
