# ==========================================
# WIDGETS "MAISON" SANS OMBRE (évite définitivement
# le bug BoxShadow / elevation de KivyMD)
# ==========================================
class FlatCard(MDBoxLayout):
    """Carte à coins arrondis, sans ombre portée."""
    bg_color = ListProperty([0.16, 0.14, 0.20, 1])
    border_color = ListProperty([0.4, 0.35, 0.5, 1])
    corner_radius = NumericProperty(dp(16))

    def __init__(self, **kwargs):
        super().__init__(**kwargs)
        with self.canvas.before:
            self._border_col = Color(*self.border_color)
            self._border_rect = RoundedRectangle(pos=self.pos, size=self.size, radius=[self.corner_radius])
            self._bg_col = Color(*self.bg_color)
            self._bg_rect = RoundedRectangle(
                pos=(self.x + dp(1.5), self.y + dp(1.5)),
                size=(self.width - dp(3), self.height - dp(3)),
                radius=[max(self.corner_radius - dp(1.5), 0)],
            )
        self.bind(pos=self._update, size=self._update, bg_color=self._update_colors, border_color=self._update_colors)

    def _update(self, *args):
        self._border_rect.pos = self.pos
        self._border_rect.size = self.size
        self._bg_rect.pos = (self.x + dp(1.5), self.y + dp(1.5))
        self._bg_rect.size = (max(self.width - dp(3), 0), max(self.height - dp(3), 0))

    def _update_colors(self, *args):
        self._border_col.rgba = self.border_color
        self._bg_col.rgba = self.bg_color


class FlatButton(ButtonBehavior, MDBoxLayout):
    """Bouton plein à coins arrondis, sans ombre portée."""
    bg_color = ListProperty([0.4, 0.3, 0.6, 1])
    corner_radius = NumericProperty(dp(14))
    label_text = StringProperty("")
    text_color = ListProperty([1, 1, 1, 1])

    def __init__(self, **kwargs):
        super().__init__(**kwargs)
        with self.canvas.before:
            self._col = Color(*self.bg_color)
            self._rect = RoundedRectangle(pos=self.pos, size=self.size, radius=[self.corner_radius])
        self.bind(pos=self._update_rect, size=self._update_rect, bg_color=self._update_color)

        self._label = MDLabel(
            halign='center', valign='middle',
            theme_text_color='Custom', text_color=self.text_color,
            bold=True,
        )
        self._label.bind(size=lambda inst, val: setattr(inst, 'text_size', val))
        self.add_widget(self._label)
        self.bind(label_text=self._update_label)
        self._update_label()

    def _update_rect(self, *args):
        self._rect.pos = self.pos
        self._rect.size = self.size

    def _update_color(self, *args):
        self._col.rgba = self.bg_color

    def _update_label(self, *args):
        self._label.text = self.label_text


class TopBar(MDBoxLayout):
    """Barre de titre simple, sans ombre portée.

    Peut être instanciée directement en KV (les propriétés sont assignées
    après construction) ou en Python via des kwargs (title_text=...,
    show_back=..., back_callback=...).
    """
    title_text = StringProperty("")
    bg_color = ListProperty([0.16, 0.13, 0.2, 1])
    show_back = BooleanProperty(True)
    back_callback = ObjectProperty(None, allownone=True)

    def __init__(self, **kwargs):
        kwargs.setdefault('orientation', 'horizontal')
        kwargs.setdefault('size_hint_y', None)
        kwargs.setdefault('height', dp(56))
        kwargs.setdefault('padding', (dp(6), 0))
        super().__init__(**kwargs)

        with self.canvas.before:
            self._col = Color(*self.bg_color)
            self._rect = Rectangle(pos=self.pos, size=self.size)
        self.bind(pos=self._update_rect, size=self._update_rect, bg_color=self._update_color)

        self._back_btn = MDIconButton(icon="arrow-left", theme_icon_color="Custom", icon_color=(1, 1, 1, 1))
        self._back_btn.bind(on_release=self._on_back_press)
        self._label = MDLabel(
            text=self.title_text, theme_text_color='Custom', text_color=(1, 1, 1, 1),
            font_style='H6', valign='middle',
        )

        if self.show_back:
            self.add_widget(self._back_btn)
        self.add_widget(self._label)

        self.bind(title_text=self._update_title, show_back=self._update_back_visibility)

    def _update_rect(self, *args):
        self._rect.pos = self.pos
        self._rect.size = self.size

    def _update_color(self, *args):
        self._col.rgba = self.bg_color

    def _update_title(self, *args):
        self._label.text = self.title_text

    def _update_back_visibility(self, *args):
        if self.show_back and self._back_btn not in self.children:
            self.add_widget(self._back_btn, index=len(self.children))
        elif not self.show_back and self._back_btn in self.children:
            self.remove_widget(self._back_btn)

    def _on_back_press(self, *args):
        if self.back_callback:
            self.back_callback()


