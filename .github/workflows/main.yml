name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Free Disk Space & Setup Swap
      run: |
        # Nettoyage de l'espace disque inutile
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        
        # Liberation securisee si un swapfile existe deja
        sudo swapoff -a || true
        sudo rm -f /swapfile

        # Creation d'un Swap de 4 Go robuste via dd
        sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache libjpeg-dev libpng-dev

    - name: Force Cython 0.29.36 & Buildozer
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "cython==0.29.36" "buildozer==1.5.0" "python-for-android==2024.1.21"

    - name: Build APK
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        export ACCEPT_SDK_LICENSES="1"
        
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: JeryVintana-APK
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/build/other_builds/
